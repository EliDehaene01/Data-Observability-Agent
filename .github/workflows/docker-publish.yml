name: Publish Docker image

# Builds the container image and pushes it to GitHub Container Registry
# (ghcr.io) so it can be pulled instead of built from source. See
# docs/docker.md. The image is public once you flip the package visibility
# to Public in the repo's Packages settings (one-time).

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "agent/**"
      - "connectors/**"
      - "reconciliation/**"
      - "results_store/**"
      - "dbt_project/**"
      - "mock_erp/**"
      - "config/**"
      - "scripts/**"
      - "examples/**"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to ghcr.io under this repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # lowercased automatically -> ghcr.io/elidehaene01/data-observability-agent
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        # Confirms the image starts and its Python imports resolve. The full
        # data-load/code-change paths need Postgres + an API key and are
        # covered by the other workflows / docker-compose, not here.
        run: |
          IMAGE=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run --rm "$IMAGE" --help
