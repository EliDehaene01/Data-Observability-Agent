environments:
  dev:
    thresholds:
      row_count_diff_pct: 5.0
      sum_diff_pct: 5.0
      sample_mismatch_pct: 10.0
    auto_actions:
      can_publish_docs: true
      can_create_ticket: true
      can_auto_resolve: true
      requires_human_approval: false
      confidence_threshold: 0.6
    notify:
      slack_channel: "#data-observability-agent"

  qa:
    thresholds:
      row_count_diff_pct: 2.0
      sum_diff_pct: 2.0
      sample_mismatch_pct: 5.0
    auto_actions:
      can_publish_docs: true
      can_create_ticket: true
      can_auto_resolve: false
      requires_human_approval: true
      confidence_threshold: 0.75
    notify:
      slack_channel: "#data-observabiliity-agent"

  prd:
    thresholds:
      row_count_diff_pct: 0.5
      sum_diff_pct: 0.5
      sample_mismatch_pct: 1.0
    auto_actions:
      can_publish_docs: false
      can_create_ticket: true
      can_auto_resolve: false
      requires_human_approval: true
      confidence_threshold: 0.9
    notify:
      slack_channel: "#data-observabiliity-agent"