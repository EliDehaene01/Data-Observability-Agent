version: 2

models:
  - name: serve_sales_orders
    description: Faithful rename/pass-through of prep_sales_orders with business-friendly column names. No new logic or filtering.
    columns:
      - name: sales_order_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: serve_monthly_revenue
    description: Monthly revenue rollup of prep_sales_orders by customer -- total net value, order count, item count.
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: revenue_month
        tests:
          - not_null
