[project]
name = "data-observability-agent"
version = "0.1.0"
description = "Agentic reconciliation system that verifies dbt views stay accurate against source ERP systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.3",
    "dbt-duckdb>=1.11.0",
    # Pinned below the latest resolvable build: pydantic-core's newest wheel
    # gets blocked by this machine's Application Control policy at DLL-load
    # time ("An Application Control policy has blocked this file"). This pair
    # is the newest combination confirmed to load.
    "pydantic==2.11.4",
    "pydantic-core==2.33.2",
    "psycopg2-binary>=2.9.10",
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "requests>=2.32.0",
    # Loads .env for local/native runs and the docker-compose demo; the CI
    # workflows pass real env vars directly and never rely on it.
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
